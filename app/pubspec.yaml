name: anypercent_app
description: 울산 버스 환승 신뢰도 기반 경로 추천 Flutter 앱
publish_to: none
version: 0.3.0+7
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: 8.3.2
  http: ^1.4.0
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/network.json
    - assets/data/observed_network.json
    - assets/data/places.json
    - assets/data/walk_graph.bin
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
